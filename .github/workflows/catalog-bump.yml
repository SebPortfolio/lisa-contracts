name: Auto Bump & Validate Catalog PR

on:
  push:
    branches-ignore:
      - main
    paths:
      - "catalog/**" # Läuft nur, wenn etwas, nicht auf den main-Branch, in catalog/** geändert wurde

jobs:
  bump-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Zum Schreiben im PR

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 10 # Damit git log die Historie vergleichen kann

      # Prüfen, ob der Bot in diesem PR bereits einmal gebumpt hat (über die gesamte Branch-Historie)
      - name: Check if PR was already bumped
        id: check_bump
        run: |
          git fetch origin main:origin/main --depth=10 || true
          BUMP_EXISTS=$(git log origin/main..HEAD --grep="auto-bump version for PR" --oneline)
          if [ -n "$BUMP_EXISTS" ]; then
            echo "BUMPED=true" >> $GITHUB_OUTPUT
            echo "Version wurde in diesem PR bereits einmal erhöht. Überspringe neuen Bump."
          else
            echo "BUMPED=false" >> $GITHUB_OUTPUT
          fi

      # Automatischer Patch-Bump (nur wenn noch nicht gebumpt wurde)
      - name: Auto-increment Patch Version
        if: steps.check_bump.outputs.BUMPED == 'false'
        run: |
          node -e '
            const fs = require("fs");

            // 1. package.json des Catalogs lesen und Patch erhöhen
            const pkgPath = "./catalog/package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            let parts = pkg.version.split(".");
            parts[2] = parseInt(parts[2]) + 1;
            const newVersion = parts.join(".");
            pkg.version = newVersion;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            // 2. Catalog-Version im eigenen POM aktualisieren
            const pomPath = "./catalog/pom.xml";
            let pom = fs.readFileSync(pomPath, "utf8");
            const regex =
              /(<artifactId>lisa-catalog-api<\/artifactId>\s*<version>)(.*?)(<\/version>)/;
            pom = pom.replace(regex, `$1${newVersion}$3`);
            fs.writeFileSync(pomPath, pom, "utf8");

            console.log("Version im Catalog erfolgreich erhöht auf: " + newVersion);
          '

      - name: Commit version bump to PR branch (nur wenn noch nicht gebumpt wurde)
        if: steps.check_bump.outputs.BUMPED == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/package.json catalog/pom.xml
          if git diff --staged --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(catalog): auto-bump version for PR [skip ci]"
            git push
          fi

      - name: Set up Java & Node and run Tests
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Build
        run: |
          mvn clean test -pl catalog -B
          npm ci --prefix catalog
          npm run build --prefix catalog

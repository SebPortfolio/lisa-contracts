name: Stable Release & Cleanup

on:
  workflow_dispatch: # Aktiviert den "Run workflow"-Button
  pull_request:
    branches: ["main"]
    types: [closed]
    paths:
      - "catalog/**" # Läuft nur, wenn etwas auf main gemerged wurde

jobs:
  publish-stable:
    # Läuft bei manuellem Start oder wenn der PR tatsächlich gemerged wurde (nicht nur geschlossen)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Um Pakete zu veröffentlichen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stabilize Versions for Release
        run: |
          node -e '
            const fs = require("fs");
            // package.json stabilisieren
            const pkgPath = "./catalog/package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = pkg.version.split("-dev")[0];
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            // pom.xml stabilisieren
            const pomPath = "./catalog/pom.xml";
            let pom = fs.readFileSync(pomPath, "utf8");
            pom = pom.replace(/(<artifactId>catalog-api<\/artifactId>\s*<version>)(.*?)(-SNAPSHOT)(<\/version>)/, "$1$2$4");
            fs.writeFileSync(pomPath, pom, "utf8");
            console.log("Stabile Release-Version vorbereitet: " + pkg.version);
          '

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      # Java / Maven Artefakt veröffentlichen
      - name: Publish Maven Catalog Package
        run: |
          mvn clean deploy -B || echo "::warning::Maven-Paket existiert bereits oder konnte nicht überschrieben werden. Fahre fort..."
        working-directory: ./catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Angular / npm Artefakt veröffentlichen
      - name: Install dependencies & Build Angular Lib
        run: |
          npm ci
          npm run build
        working-directory: ./catalog

      - name: Publish npm Package
        run: |
          npm publish || echo "::warning::Paket-Version existiert bereits oder konnte nicht überschrieben werden. Fahre fort..."
        working-directory: ./catalog/dist # Hier liegt das fertige Paket von ng-packagr
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Alte Dev-Pakete löschen
      - name: Cleanup old dev packages
        uses: actions/github-script@v7
        with:
          script: |
            const packageName = "catalog-api";

            // Alle Versionen des Pakets abrufen
            const response = await github.rest.packages.getAllPackageVersionsForPackageOwner({
              package_type: 'npm',
              package_name: packageName,
              owner: context.repo.owner,
            });

            // Filtern nach Versionen, die "-dev" im Namen tragen
            const devVersions = response.data.filter(version => 
              version.metadata.npm.version.includes('-dev')
            );

            console.log(`Gefundene Dev-Versionen zum Löschen: ${devVersions.length}`);

            // Schleife über alle Dev-Versionen und löschen
            for (const ver of devVersions) {
              console.log(`Lösche Version ID ${ver.id} (${ver.metadata.npm.version})...`);
              await github.rest.packages.deletePackageVersionForPackageOwner({
                package_type: 'npm',
                package_name: packageName,
                owner: context.repo.owner,
                package_version_id: ver.id
              });
            }
            console.log("Cleanup erfolgreich abgeschlossen!");
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

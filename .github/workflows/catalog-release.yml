name: Stable Release & Cleanup

on:
  workflow_dispatch: # Wird manuell für den fertigen PR-Branch gestartet

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Um in den PR-Branch zu committen
      packages: write # Um Pakete zu veröffentlichen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Stabilize Script for Release
        run: node catalog/scripts/stabilize-release-catalog.js
      - name: Commit stable versions to PR branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/package.json catalog/pom.xml
          if git diff --staged --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(catalog): finalize stable release version [skip ci]"
            git push
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      # Java / Maven Artefakt veröffentlichen
      - name: Publish Maven Catalog Package
        run: |
          mvn clean deploy -B || echo "::warning::Maven-Paket existiert bereits oder konnte nicht überschrieben werden. Fahre fort..."
        working-directory: ./catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Angular / npm Artefakt veröffentlichen
      - name: Install dependencies & Build Angular Lib
        run: |
          npm ci
          npm run build
        working-directory: ./catalog

      - name: Publish npm Package
        run: |
          npm publish || echo "::warning::Paket-Version existiert bereits oder konnte nicht überschrieben werden. Fahre fort..."
        working-directory: ./catalog/dist # Hier liegt das fertige Paket von ng-packagr
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Alte Dev-Pakete löschen
      - name: Cleanup old dev packages
        uses: actions/github-script@v7
        with:
          script: |
            const scope = "sebportfolio";
            const packageName = "lisa-catalog-api";
            const fullPackageName = `${scope}%2F${packageName}`; // Ergibt: sebportfolio%2Flisa-catalog-api

            try {
              // Alle Versionen des Pakets abrufen
              const response = await github.rest.packages.getAllPackageVersionsForPackageOwner({
                package_type: 'npm',
                package_name: fullPackageName,
                owner: context.repo.owner,
              });

              // Filtern nach Versionen, die "-dev" im Namen tragen
              const devVersions = response.data.filter(version => 
                version.metadata.npm.version.includes('-dev')
              );

              console.log(`Gefundene Dev-Versionen zum Löschen: ${devVersions.length}`);

              // Schleife über alle Dev-Versionen und löschen
              for (const ver of devVersions) {
                console.log(`Lösche Version ID ${ver.id} (${ver.metadata.npm.version})...`);
                await github.rest.packages.deletePackageVersionForPackageOwner({
                  package_type: 'npm',
                  package_name: fullPackageName,
                  owner: context.repo.owner,
                  package_version_id: ver.id
                });
              }
            } catch (error) {
              console.error("Fehler beim Cleanup: " + error.message);
            }
            console.log("Cleanup erfolgreich abgeschlossen!");
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

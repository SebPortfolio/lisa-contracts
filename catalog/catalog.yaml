openapi: 3.0.3
info:
  title: LISA Catalog-Service API
  version: 0.0.1
paths:
  "/api/v1/categories":
    get:
      summary: Abruf einer Liste mit allen Produkt-Kategorien und ihrem ersten Parent
      operationId: getCategoryList
      tags:
        - ProductCategory
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCategory"

    post:
      summary: Neue Produkt-Kategorie erstellen
      operationId: createCategory
      tags:
        - ProductCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCategoryCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCategory"

components:
  schemas:
    ProductCategory:
      type: object
      description: Produkt-Kategorie Item inklusive dem ersten Parent
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: eindeutige Idenifikation der Produkt-Kategorie
          example: 1
        name:
          type: string
          description: Name der Produkt-Kategorie
          example: Fruchtsäfte
        parent:
          $ref: "#/components/schemas/ParentProductCategory"

    ParentProductCategory:
      type: object
      description: Produkt-Kategorie Item ohne weiteres Parent
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: eindeutige Idenifikation der übergeordneten Produkt-Kategorie
          example: 2
        name:
          type: string
          description: Name der übergeordneten Produkt-Kategorie
          example: Getränke

    ProductCategoryCreateRequest:
      type: object
      description: Request zum Erstellen einer neuen Produkt-Kategorie
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          description: Name der neuen Produkt-Kategorien
          example: Gemüse
        parentId:
          type: integer
          format: int64
          minimum: 0
          description: eindeutige Idenifikation der übergeordneten für die neue Produkt-Kategorie
          example: 3
